name: Update tree data

# Downloads the London Public Realm Trees dataset and rebuilds the local tree map's data
# (trees/trees-data.txt.locked and trees/trees-lookup.json.locked, locked for subscribers). Run by hand when the GLA publishes new data.
on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: "Optional: direct link to the trees CSV, if the automatic lookup fails"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  trees:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet cryptography==44.0.0
          python scripts/trees.py
        env:
          TREES_CSV_URL: ${{ inputs.csv_url }}
          SUBSCRIBER_PASSWORD: ${{ secrets.SUBSCRIBER_PASSWORD }}   # the tree data is locked for subscribers
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trees/trees-data.txt.locked trees/trees-lookup.json.locked
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update tree data"
          git pull --rebase -X theirs origin main && git push
