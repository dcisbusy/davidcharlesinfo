name: Evidence library

# Rebuilds David's private Nature Evidence Library (/evidence/) whenever he saves it from /evidence/edit/.
# The editor saves the Markdown locked (evidence/library.md.locked); this turns it into the page's locked HTML
# (evidence/library.locked) with scripts/make_evidence.py. Needs the PAID_SUBSCRIBER_PASSWORD secret.
# To run it by hand: Actions tab -> "Evidence library" -> "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evidence/library.md.locked'
      - 'scripts/make_evidence.py'

permissions:
  contents: write

concurrency:
  group: evidence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Build the library
        env:
          PAID_SUBSCRIBER_PASSWORD: ${{ secrets.PAID_SUBSCRIBER_PASSWORD }}
        run: |
          pip install --quiet cryptography==44.0.0 markdown==3.11
          python scripts/make_evidence.py
      - name: Save it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add evidence/library.locked
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Rebuild the evidence library"
          git pull --rebase -X theirs origin main && git push
