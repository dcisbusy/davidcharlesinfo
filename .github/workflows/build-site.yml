# Builds davidcharles.info using scripts/build.py.
#
# Runs every evening (to pick up new newsletter issues), and straight away
# whenever you change home-intro.html, a post, the list of posts
# (blog-archive/index.json), the stylesheet or the build script.
# To run it by hand: Actions tab -> "Build site" -> "Run workflow".

name: Build site

on:
  schedule:
    - cron: '17 21 * * *'   # every day at 21:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'home-intro.html'
      - 'blog-archive/index.json'
      - 'scripts/**'
      - 'assets/**'
      - '**/index.html'

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the site
        run: python scripts/build.py

      - name: Save any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site"
            git push
          fi
