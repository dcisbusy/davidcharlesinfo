# Builds davidcharles.info using scripts/build.py.
#
# Runs every evening (to pick up new newsletter issues), and straight away
# whenever you change home-intro.html, a post, the list of posts
# (blog-archive/index.json), the stylesheet, the build script, or the map's
# places and corrections (data/places.json, data/story-overrides.json).
# To run it by hand: Actions tab -> "Build site" -> "Run workflow".

name: Build site

on:
  schedule:
    - cron: '17 21 * * *'   # every day at 21:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'home-intro.html'
      - 'blog-archive/index.json'
      - 'scripts/**'
      - 'assets/**'
      - 'data/**'
      - '**/index.html'

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Note where we started
        run: echo "START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the site
        run: python scripts/build.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Build the search index
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts pagefind@1.6.0
          node scripts/search.mjs

      - name: Save any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site"
            git pull --rebase -X theirs origin main && git push
          fi

      - name: Tell search engines about changed pages (IndexNow)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          OLD="$START"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then OLD="$BEFORE"; fi
          python scripts/indexnow.py "$OLD" HEAD || true
