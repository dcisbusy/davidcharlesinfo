name: Ride routes

# Follows the roads between the places in each ride (data/rides/*.json) and saves the lines the rides map draws
# (data/rides/*.route.json). Runs when a ride's data changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/rides/*.json"
      - "!data/rides/*.route.json"
      - "scripts/ride_routes.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: ride-routes
  cancel-in-progress: true

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python scripts/ride_routes.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rides/*.route.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update ride routes"
          git pull --rebase -X theirs origin main && git push
          gh workflow run build-site.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
