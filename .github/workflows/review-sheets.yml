name: Tidy review photos (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the throwaway review-sheets branch
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/review-sheets" || true
