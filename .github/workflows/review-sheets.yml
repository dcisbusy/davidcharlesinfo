name: Review photo sheets (one-off)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: pip install pillow && mkdir review-sheets && python .github/review/sheets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: review-sheets
          path: review-sheets/
          retention-days: 3
