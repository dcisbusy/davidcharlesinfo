<header class="entry-head"><h1>Cycling to Syria: Campsites</h1></header>
<div class="entry-content">
<!--content:start--><p class="wp-block-paragraph">In the early summer of 2016, I cycled from London to Vienna. 46 wild campsites and homes courtesy of friends and Warmshowers. I managed to photograph 41 of them.</p>
